services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

  firewall:
    build: .
    command: bash -c "pip install apscheduler && python3 -m src.main"
    container_name: firewall-app
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./hf_cache:/root/.cache/huggingface/hub
    depends_on:
      - qdrant
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - HF_HUB_OFFLINE=1
      - QDRANT_URL=http://qdrant:6333
      - FIREWALL_MODE=server
      - FORCE_REBUILD=${FORCE_REBUILD:-false}
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
